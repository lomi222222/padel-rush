<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kw-theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>الأذكى</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <h1>🎯 الأذكى</h1>
        <a class="home-link" href="index.html">القائمة الرئيسية</a>
      </div>

      <!-- شاشة إعداد الفرق -->
      <section id="setup-screen" class="card stack">
        <h2 class="center">إعداد الفرق</h2>
        <p class="muted center">اختر عدد الفرق (من 2 إلى 4) وأدخل أسماءهم</p>

        <div class="team-setup-controls">
          <span>عدد الفرق</span>
          <div class="stepper">
            <button type="button" id="dec-team">-</button>
            <span id="team-count-label">2</span>
            <button type="button" id="inc-team">+</button>
          </div>
        </div>

        <div id="team-setup-list" class="team-setup-list"></div>

        <button id="start-game-btn" class="btn btn-primary btn-block">
          ابدأ اللعبة
        </button>
      </section>

      <!-- شاشة اللوحة -->
      <section id="board-screen" class="stack hidden">
        <div id="scoreboard" class="scoreboard"></div>
        <div class="board-scroll">
          <div id="board" class="board"></div>
        </div>
      </section>

      <!-- شاشة النهاية -->
      <section id="end-screen" class="card stack hidden">
        <div class="winner-banner">
          <h2 id="winner-name">🏆 الفريق الفائز</h2>
          <p id="winner-score"></p>
        </div>
        <div id="final-scores" class="final-scores"></div>
        <button id="restart-btn" class="btn btn-primary btn-block">
          العب مرة أخرى
        </button>
      </section>
    </div>

    <!-- نافذة السؤال -->
    <div id="question-overlay" class="overlay hidden">
      <div class="question-card">
        <div class="question-meta">
          <span id="q-picker" class="badge"></span>
          <span id="q-category" class="badge"></span>
          <span id="q-points" class="points"></span>
        </div>

        <div id="q-text" class="question-text"></div>

        <div id="q-hint" class="hint-box hidden"></div>
        <div id="q-choices" class="choices-grid hidden"></div>

        <div id="q-team-abilities" class="team-abilities-list"></div>

        <div id="q-resolve" class="resolve-row">
          <button id="reveal-btn" class="btn btn-outline btn-block">
            إظهار الإجابة
          </button>
        </div>

        <div id="q-answer-box" class="hidden stack">
          <div class="question-text" id="q-answer-text" style="font-size: 20px; color: var(--green-dark)"></div>
          <p class="muted center">أي فريق أجاب إجابة صحيحة؟</p>
          <div id="q-winner-buttons" class="winner-buttons"></div>
        </div>
      </div>
    </div>

    <script src="js/questions.js"></script>
    <script src="js/trivia.js"></script>
    <script src="js/theme.js" defer></script>
  </body>
</html>
