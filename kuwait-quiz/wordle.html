<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kw-theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>احزر الكلمة - الأذكى</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <h1>احزر الكلمة</h1>
        <a class="home-link" href="index.html" title="القائمة الرئيسية" aria-label="الأذكى — القائمة الرئيسية">
          <svg class="topbar-mark" viewBox="0 0 50 24" aria-hidden="true">
            <rect x="1.5" y="1.5" width="14" height="21" rx="4" fill="none" stroke="currentColor" stroke-width="3" />
            <rect x="18" y="1.5" width="14" height="21" rx="4" fill="currentColor" />
            <rect x="34.5" y="1.5" width="14" height="21" rx="4" fill="none" stroke="currentColor" stroke-width="3" />
          </svg>
          الأذكى
        </a>
      </div>

      <!-- شاشة إعداد الفريقين -->
      <!-- المجموعات ملفوفة عشان الوضع العرضي يصفّها بعمودين. بالوضع الطولي كل
           غلاف يصير display:contents فيختفي من التخطيط تماماً — الترتيب والشكل
           يبقون مثل ما هم بالضبط -->
      <section id="wordle-setup-screen" class="card stack">
        <div class="setup-head">
          <h2 class="center">إعداد الفريقين</h2>
          <p class="muted center setup-intro">فريقان، كل فريق ياخذ دوره كامل بكلمته الخاصة</p>
        </div>

        <div class="setup-col">
          <div class="team-setup-list">
            <div class="team-setup-row">
              <div class="team-swatch" style="background: #12539f"></div>
              <input type="text" id="wordle-team1-input" maxlength="20" placeholder="الفريق الأول" />
            </div>
            <div class="team-setup-row">
              <div class="team-swatch" style="background: #06264a"></div>
              <input type="text" id="wordle-team2-input" maxlength="20" placeholder="الفريق الثاني" />
            </div>
          </div>

          <p class="muted center">عدد الجولات</p>
          <select id="wordle-round-count" class="round-time-select"></select>

          <p class="muted center">وقت الجولة</p>
          <select id="wordle-round-time" class="round-time-select"></select>
          <input
            type="number"
            id="wordle-round-time-custom"
            class="round-time-custom hidden"
            min="1"
            max="60"
            step="1"
            value="4"
            placeholder="كم دقيقة؟"
          />
          <p id="wordle-round-time-hint" class="muted center round-time-hint hidden">
            بالدقائق (من ١ إلى ٦٠)
          </p>
        </div>

        <div class="setup-col">
          <p class="muted center">اختر الفئات (كلها مفعّلة افتراضياً)</p>
          <div class="abilities-row">
            <label class="category-chip all">
              <input type="checkbox" id="wordle-cat-all" checked />
              الكل
            </label>
          </div>
          <div id="wordle-category-list" class="abilities-row"></div>
          <p id="wordle-category-error" class="hidden" style="color: var(--red); font-weight: 700; text-align: center"></p>
        </div>

        <div class="setup-foot">
          <button id="wordle-start-btn" class="btn btn-primary btn-block">
            ابدأ اللعبة
          </button>

          <div class="online-divider"><span>أو</span></div>
          <a class="btn btn-outline btn-block" href="wordle-online.html">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="3.2"/><path d="M2.5 19v-1.5c0-2.5 2.7-4 6-4s6 1.5 6 4V19"/><circle cx="17.5" cy="9" r="2.6"/><path d="M16 13.6c3 .2 5.5 1.6 5.5 3.9V19"/></svg> العب أونلاين مع ربعك
          </a>
        </div>
      </section>

      <!-- شاشة اللعب -->
      <section id="wordle-play-screen" class="stack hidden">
        <!-- أربع مناطق: النتائج، الشبكة، المعلومات (الفئات/الجولة/البوق/الدليل/
             المساعدات/السجل)، الكيبورد. بالطول تترتب فوق بعض بهالتسلسل، وبالعرض
             تصير ثلاث أعمدة (كيبورد | معلومات | شبكة) — شوف .wordle-wrap بالـCSS -->
        <div class="card wordle-wrap">
          <svg class="wrap-motif" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,58 L18,4 L36,58 L54,4 L72,58 L90,4 L108,58 L126,4 L144,58 L162,4 L180,58 L198,4"
              fill="none" stroke="currentColor" stroke-width="3" />
          </svg>
          <div class="score-row">
            <div id="wordle-scoreboard" class="scoreboard"></div>
            <button id="wordle-end-match-btn" class="btn btn-outline">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4.5h11l-2.5 4 2.5 4H6"/></svg> إنهاء اللعبة
            </button>
          </div>

          <div class="wordle-info">
            <div id="wordle-active-categories" class="cat-pills"></div>
            <p class="round-line" id="wordle-subtitle"></p>
            <div id="wordle-timer" class="round-timer hidden"></div>
            <div class="boq-slot">
              <button id="wordle-boq-btn" class="btn boq-btn hidden"></button>
              <p id="wordle-steal-note" class="steal-note hidden"></p>
            </div>
            <p class="wordle-legend">
              <span><i class="lg green"></i> مكانه صحيح</span>
              <span><i class="lg yellow"></i> بمكان آخر</span>
              <span><i class="lg gray"></i> غير موجود</span>
            </p>

            <div class="abilities-row">
              <button id="wordle-hint-category-btn" class="ability-btn">
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.5 1 .5 1.6v.5h6v-.5c0-.6 0-1.2.5-1.6A6 6 0 0 0 12 3z"/></svg> الفئة ٥٠٪−
              </button>
              <button id="wordle-hint-repeat-btn" class="ability-btn">
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="8.5" height="11" rx="2.5"/><rect x="13" y="6.5" width="8.5" height="11" rx="2.5"/></svg> حرف مكرر؟ ٥٠−
              </button>
              <button id="wordle-hint-letter-btn" class="ability-btn">
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/></svg> اكشف حرف ١٠٠−
              </button>
            </div>

            <div id="wordle-hint-log" class="stack"></div>
          </div>

          <div class="wordle-grid-scroll">
            <div id="wordle-grid" class="wordle-grid"></div>
          </div>

          <div class="wordle-controls">
            <div id="wordle-message" class="wordle-message"></div>

            <div id="keyboard" class="keyboard"></div>

            <div id="wordle-round-end" class="row hidden" style="justify-content: center">
              <button id="wordle-next-team-btn" class="btn btn-primary">
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5"/><path d="M11 6l-6 6 6 6"/></svg> دور الفريق التالي
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- شاشة النهاية -->
      <section id="wordle-end-screen" class="card stack hidden">
        <div class="winner-banner">
          <h2 id="wordle-winner-name"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4.5v1.5A3.5 3.5 0 0 0 8 11"/><path d="M17 6h2.5v1.5A3.5 3.5 0 0 1 16 11"/><path d="M12 14v3"/><path d="M8.5 20h7"/></svg> الفريق الفائز</h2>
          <p id="wordle-winner-score"></p>
        </div>
        <div id="wordle-final-scores" class="final-scores"></div>
        <button id="wordle-restart-btn" class="btn btn-primary btn-block">
          لعبة جديدة
        </button>
      </section>
    </div>

    <script src="js/words.js"></script>
    <script src="js/wordle-core.js"></script>
    <script src="js/wordle-view.js"></script>
    <script src="js/wordle.js"></script>
    <script src="js/theme.js" defer></script>
  </body>
</html>
