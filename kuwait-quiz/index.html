<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kw-theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>الأذكى - ألعاب تحدي المعلومات والكلمات</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="home-page">
    <main class="page">
      <div class="hero">
        <svg class="hero-motif hero-motif--tr" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true">
          <path
            d="M0,58 L18,4 L36,58 L54,4 L72,58 L90,4 L108,58 L126,4 L144,58 L162,4 L180,58 L198,4"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />
        </svg>
        <svg class="hero-motif hero-motif--bl" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true">
          <path
            d="M0,58 L18,4 L36,58 L54,4 L72,58 L90,4 L108,58 L126,4 L144,58 L162,4 L180,58 L198,4"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />
        </svg>

        <div class="brand-mark">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <polygon points="24,3 45,24 24,45 3,24" class="brand-mark-gem" />
            <polyline points="10,28 15,18 20,28 25,18 30,28 35,18" class="brand-mark-weave" />
          </svg>
          <h1>الأذكى</h1>
        </div>
        <div class="hero-rule"></div>
        <p>اختر لعبتك وابدأ التحدي مع أصدقائك</p>
      </div>

      <div class="menu-grid">
        <a class="menu-card" href="wordle.html">
          <div class="menu-icon menu-icon--navy">
            <svg viewBox="0 0 28 28" aria-hidden="true">
              <rect x="2" y="10.5" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2" />
              <rect x="10.5" y="10.5" width="7" height="7" rx="1.5" fill="currentColor" />
              <rect x="19" y="10.5" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </div>
          <h2>احزر الكلمة</h2>
          <p>
            على جهاز واحد: فريقان يتناوبون على نفس الجوال. خمّن الكلمة
            العربية، الأخضر في مكانه الصحيح والأصفر موجود بمكان خاطئ.
          </p>
        </a>

        <a class="menu-card" href="wordle-online.html">
          <div class="menu-icon menu-icon--gold">
            <svg viewBox="0 0 28 28" aria-hidden="true">
              <circle cx="6" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="2" />
              <path
                d="M6 13.5c-2.8 0-5 1.8-5 4.5v2h10v-2c0-2.7-2.2-4.5-5-4.5z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <circle cx="22" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="2" />
              <path
                d="M22 13.5c-2.8 0-5 1.8-5 4.5v2h10v-2c0-2.7-2.2-4.5-5-4.5z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <path
                d="M12 12l1.5 -2 1.5 2 1.5 -2 1.5 2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <h2>احزر الكلمة أونلاين</h2>
          <p>
            نفس اللعبة بس كل واحد على جواله. واحد يسوي غرفة ويدز الرابط،
            والباقي يدشون ويتوزعون على فريقين.
          </p>
        </a>
      </div>
    </main>

    <script src="js/theme.js" defer></script>
  </body>
</html>
