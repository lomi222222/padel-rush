<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kw-theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>الأذكى - ألعاب تحدي المعلومات والكلمات</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <div class="hero">
        <h1>🧠 الأذكى</h1>
        <p>اختر لعبتك وابدأ التحدي مع أصدقائك</p>
      </div>

      <div class="menu-grid">
        <a class="menu-card" href="wordle.html">
          <div class="icon">🔤</div>
          <h2>احزر الكلمة</h2>
          <p>
            على جهاز واحد: فريقان يتناوبون على نفس الجوال. خمّن الكلمة
            العربية، الأخضر في مكانه الصحيح والأصفر موجود بمكان خاطئ.
          </p>
        </a>

        <a class="menu-card" href="wordle-online.html">
          <div class="icon">🌐</div>
          <h2>احزر الكلمة أونلاين</h2>
          <p>
            نفس اللعبة بس كل واحد على جواله. واحد يسوي غرفة ويدز الرابط،
            والباقي يدشون ويتوزعون على فريقين.
          </p>
        </a>
      </div>
    </main>

    <script src="js/theme.js" defer></script>
    <script src="js/sound.js" defer></script>
  </body>
</html>
