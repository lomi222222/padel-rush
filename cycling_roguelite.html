// Home-screen cyclist — clean flat-illustration style matching the casual rider reference.
// Solid flat colors (no shading), rotating wheels, pumping legs, applied skin colors.
// Rides briskly across the road strip so the screen feels alive.
function drawHomeCyclist(g, roadY) {
  const skin = currentSkin();
  // Moves left-to-right across the road strip (~3 seconds per crossing)
  const cycleLen = 180;
  const phase = (g.t % cycleLen) / cycleLen;
  const cx = -120 + phase * (W + 240);
  // Sit on the asphalt, below the yellow centerline (in the lower lane)
  const cy = roadY + 50;
  const wheelSpin = g.t * 0.55;
  const pedalA = wheelSpin * 0.5;
  const bob = Math.abs(Math.sin(pedalA)) * 1.3;

  // ---- Drop shadow ----
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 22, 36, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // ---- Speed lines (behind) ----
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 4; i++) {
    const lx = cx - 30 - i * 11;
    const ly = cy - 4 + (i - 1.5) * 6;
    ctx.beginPath();
    ctx.moveTo(lx, ly); ctx.lineTo(lx - 18 - i*3, ly);
    ctx.stroke();
  }

  // ============================================================
  // BIKE — simple flat shapes (thicker, bigger overall)
  // ============================================================
  const rwx = cx - 30, rwy = cy + 18;            // rear wheel
  const fwx = cx + 30, fwy = cy + 18;            // front wheel
  const wR  = 18;                                // wheel radius
  const bb  = { x: cx,      y: cy + 8  };        // bottom bracket
  const stT = { x: cx - 8,  y: cy - 18 };        // seat tube top
  const htT = { x: cx + 20, y: cy - 18 };        // head tube top

  // Wheels (black tire ring + thin rim + spinning spokes + hub)
  for (const [wx, wy] of [[rwx, rwy], [fwx, fwy]]) {
    // Tire
    ctx.fillStyle = '#0a0a0c';
    ctx.beginPath(); ctx.arc(wx, wy, wR, 0, Math.PI*2); ctx.fill();
    // Open center (lets spokes show against bg)
    ctx.fillStyle = '#2a3140';
    ctx.beginPath(); ctx.arc(wx, wy, wR - 2.5, 0, Math.PI*2); ctx.fill();
    // Spokes
    ctx.strokeStyle = 'rgba(220,220,225,0.75)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let s = 0; s < 10; s++) {
      const a = wheelSpin + s * Math.PI / 5;
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + Math.cos(a) * (wR - 3), wy + Math.sin(a) * (wR - 3));
    }
    ctx.stroke();
    // Hub
    ctx.fillStyle = '#dadada';
    ctx.beginPath(); ctx.arc(wx, wy, 2.2, 0, Math.PI*2); ctx.fill();
  }

  // Frame — flat thick tubes in skin.frame color
  ctx.strokeStyle = skin.frame; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bb.x, bb.y);   ctx.lineTo(stT.x, stT.y);     // seat tube
  ctx.moveTo(bb.x, bb.y);   ctx.lineTo(htT.x, htT.y);     // down tube
  ctx.moveTo(stT.x, stT.y); ctx.lineTo(htT.x, htT.y);     // top tube
  ctx.moveTo(bb.x, bb.y);   ctx.lineTo(rwx, rwy);         // chainstay
  ctx.moveTo(stT.x, stT.y); ctx.lineTo(rwx, rwy);         // seat stay
  ctx.moveTo(htT.x, htT.y); ctx.lineTo(fwx, fwy);         // fork
  ctx.stroke();
  ctx.lineCap = 'butt';

  // Drop handlebars (simple curve forward + down)
  ctx.strokeStyle = '#1a1a1c'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(htT.x, htT.y); ctx.lineTo(htT.x + 4, htT.y - 8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(htT.x + 4, htT.y - 8);
  ctx.bezierCurveTo(htT.x + 18, htT.y - 9, htT.x + 18, htT.y + 5, htT.x + 12, htT.y + 7);
  ctx.stroke();
  ctx.lineCap = 'butt';

  // Saddle
  ctx.fillStyle = '#0e0e10';
  ctx.beginPath();
  ctx.moveTo(stT.x - 6, stT.y - 2); ctx.lineTo(stT.x + 4, stT.y - 2);
  ctx.lineTo(stT.x + 3, stT.y); ctx.lineTo(stT.x - 6, stT.y);
  ctx.closePath(); ctx.fill();

  // Crank + pedal (animated)
  const pedalX = bb.x + Math.cos(pedalA) * 8;
  const pedalY = bb.y + Math.sin(pedalA) * 8;
  ctx.strokeStyle = '#1a1a1c'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(bb.x, bb.y); ctx.lineTo(pedalX, pedalY);
  ctx.stroke();
  // Pedal block
  ctx.fillStyle = '#0a0a0c';
  ctx.fillRect(pedalX - 5, pedalY - 1.5, 10, 3);

  // ============================================================
  // RIDER — simple flat colors (casual cycling style from reference)
  // ============================================================
  const SKIN_TONE = '#f4c8a0';
  const SHORTS_GRAY = '#a8a8b0';
  const SHOE_TEAL = '#4adfc4';

  // Anchors (bigger, taller proportions)
  const hipX  = stT.x + 2, hipY  = stT.y - 1 + bob;
  const shldX = htT.x - 2, shldY = htT.y - 26 + bob;
  const handX = htT.x + 12, handY = htT.y + 7;

  // ---- LEG (animated with pedal — thicker) ----
  const kneeX = (hipX + pedalX) / 2 + 4;
  const kneeY = (hipY + pedalY) / 2 - 5;
  // Upper leg in shorts (gray) — thicker stroke
  ctx.strokeStyle = SHORTS_GRAY; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hipX, hipY); ctx.lineTo(kneeX, kneeY);
  ctx.stroke();
  // Lower leg (skin) — thicker
  ctx.strokeStyle = SKIN_TONE; ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(kneeX, kneeY); ctx.lineTo(pedalX, pedalY - 3);
  ctx.stroke();
  // Teal shoe — bigger
  ctx.fillStyle = SHOE_TEAL;
  roundRect(pedalX - 7, pedalY - 5, 14, 4, 1.5); ctx.fill();
  ctx.lineCap = 'butt';

  // ---- TORSO (red shirt — uses skin.arm color) — bigger, thicker ----
  ctx.fillStyle = skin.arm;
  ctx.beginPath();
  ctx.moveTo(hipX - 5, hipY - 3);
  ctx.lineTo(shldX - 2, shldY);
  ctx.lineTo(shldX + 7, shldY + 3);
  ctx.lineTo(hipX + 6, hipY);
  ctx.closePath(); ctx.fill();
  // Shirt center accent (skin.jersey color)
  ctx.fillStyle = skin.jersey;
  ctx.beginPath();
  ctx.moveTo(hipX - 2, hipY - 3);
  ctx.lineTo(shldX, shldY + 1);
  ctx.lineTo(shldX + 2, shldY + 2);
  ctx.lineTo(hipX, hipY - 1);
  ctx.closePath(); ctx.fill();
  // Shirt sleeve (short sleeve hint at shoulder)
  ctx.fillStyle = skin.arm;
  ctx.beginPath();
  ctx.arc(shldX + 4, shldY + 2, 4, 0, Math.PI*2);
  ctx.fill();

  // ---- ARM (skin tone, thicker) ----
  ctx.strokeStyle = SKIN_TONE; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(shldX + 4, shldY + 2); ctx.lineTo(handX, handY);
  ctx.stroke();
  // Hand
  ctx.fillStyle = SKIN_TONE;
  ctx.beginPath(); ctx.arc(handX, handY, 3, 0, Math.PI*2); ctx.fill();
  ctx.lineCap = 'butt';

  // ---- HEAD + HELMET — bigger ----
  const headX = shldX + 5, headY = shldY - 6;
  // Neck (skin tone)
  ctx.fillStyle = SKIN_TONE;
  ctx.fillRect(shldX + 2, shldY - 4, 4, 5);
  // Head (skin tone — face base) — bigger
  ctx.beginPath(); ctx.ellipse(headX, headY, 8, 7, 0, 0, Math.PI*2); ctx.fill();
  // Helmet on top (skin.helmet color, aero teardrop) — bigger
  ctx.fillStyle = skin.helmet;
  ctx.beginPath();
  ctx.moveTo(headX + 9, headY - 2);
  ctx.bezierCurveTo(headX + 10, headY - 9, headX - 7, headY - 10, headX - 8, headY - 4);
  ctx.bezierCurveTo(headX - 6, headY - 1, headX + 5, headY - 1, headX + 9, headY - 2);
  ctx.closePath(); ctx.fill();
  // Helmet vents (3 dark slits)
  ctx.fillStyle = '#0a0a0c';
  ctx.fillRect(headX - 5, headY - 6, 2, 2);
  ctx.fillRect(headX - 1, headY - 7, 2, 2);
  ctx.fillRect(headX + 3, headY - 6, 2, 2);
  // Eyes/sunglasses
  ctx.fillStyle = '#000';
  ctx.fillRect(headX + 3, headY + 1, 5, 2);
}

// Helper: detailed wheel for the home cyclist
function drawHomeWheel(x, y, r, spin) {
  // Tire (thick black ring) with outline
  ctx.fillStyle = '#0a0a0c';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  // Outer rim (silver)
  ctx.fillStyle = '#646874';
  ctx.beginPath(); ctx.arc(x, y, r - 2.5, 0, Math.PI*2); ctx.fill();
  // Wheel interior (sky-colored — lets spokes show)
  ctx.fillStyle = '#2a3140';
  ctx.beginPath(); ctx.arc(x, y, r - 4, 0, Math.PI*2); ctx.fill();
  // Spokes (rotating)
  ctx.strokeStyle = 'rgba(220, 222, 230, 0.85)';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  for (let s = 0; s < 12; s++) {
    const a = spin + s * Math.PI / 6;
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * (r - 4), y + Math.sin(a) * (r - 4));
  }
  ctx.stroke();
  // Hub
  ctx.fillStyle = '#dadada';
  ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#0a0a0c';
  ctx.beginPath(); ctx.arc(x, y, 1.1, 0, Math.PI*2); ctx.fill();
  // Tire highlight (top-left arc)
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(x, y, r - 0.5, Math.PI * 1.15, Math.PI * 1.6);
  ctx.stroke();
}

// Static top-down cyclist for the shop card preview.
// Mirrors the in-game drawCyclist() composition at small scale.
function drawShopPreviewCyclist(cx, cy, skin) {
  // Wheels (thin)
  ctx.fillStyle = '#1a1a1c';
  roundRect(cx - 1.5, cy + 16, 3, 22, 1.5); ctx.fill();
  roundRect(cx - 1.5, cy - 38, 3, 22, 1.5); ctx.fill();
  ctx.fillStyle = '#dadada';
  ctx.beginPath(); ctx.arc(cx, cy + 27, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy - 27, 1.5, 0, Math.PI*2); ctx.fill();

  // Frame (skin-colored diamond)
  ctx.strokeStyle = skin.frame; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, cy + 16); ctx.lineTo(cx, cy + 4);
  ctx.moveTo(cx, cy + 4);  ctx.lineTo(cx, cy - 14);
  ctx.stroke();
  ctx.lineCap = 'butt';

  // Chainstays
  ctx.strokeStyle = skin.frame; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx - 1, cy + 4); ctx.lineTo(cx - 2, cy + 22);
  ctx.moveTo(cx + 1, cy + 4); ctx.lineTo(cx + 2, cy + 22);
  ctx.stroke();

  // Cranks
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - 6, cy + 4); ctx.lineTo(cx + 6, cy + 4);
  ctx.stroke();
  ctx.fillStyle = '#222';
  roundRect(cx - 9, cy + 2, 4, 4, 1); ctx.fill();
  roundRect(cx + 5, cy + 2, 4, 4, 1); ctx.fill();

  // Drop bars (curved horseshoe)
  ctx.strokeStyle = '#1a1a1c'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 14); ctx.lineTo(cx, cy - 18);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, cy - 18);
  ctx.bezierCurveTo(cx - 4, cy - 22, cx - 11, cy - 21, cx - 11, cy - 16);
  ctx.moveTo(cx, cy - 18);
  ctx.bezierCurveTo(cx + 4, cy - 22, cx + 11, cy - 21, cx + 11, cy - 16);
  ctx.stroke();
  // Bar tape grips
  ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx - 11, cy - 18); ctx.lineTo(cx - 11, cy - 14);
  ctx.moveTo(cx + 11, cy - 18); ctx.lineTo(cx + 11, cy - 14);
  ctx.stroke();

  // Saddle
  ctx.fillStyle = '#0e0e10';
  ctx.beginPath();
  ctx.moveTo(cx - 3, cy + 14); ctx.lineTo(cx + 3, cy + 14);
  ctx.lineTo(cx + 2, cy + 19); ctx.lineTo(cx - 2, cy + 19);
  ctx.closePath(); ctx.fill();

  // Rider torso (jersey body)
  ctx.fillStyle = skin.arm;
  ctx.beginPath();
  ctx.moveTo(cx - 6, cy + 8);
  ctx.lineTo(cx - 7, cy - 4);
  ctx.lineTo(cx - 5, cy - 8);
  ctx.lineTo(cx + 5, cy - 8);
  ctx.lineTo(cx + 7, cy - 4);
  ctx.lineTo(cx + 6, cy + 8);
  ctx.closePath(); ctx.fill();
  // Spine shading
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(cx - 1.5, cy - 6, 3, 14);
  // Center stripe
  ctx.fillStyle = skin.jersey;
  ctx.fillRect(cx - 1, cy - 6, 2, 14);
  // Sleeve cuffs (white)
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - 7, cy - 2, 1.5, 3);
  ctx.fillRect(cx + 5.5, cy - 2, 1.5, 3);

  // Arms reaching forward to drop bars
  ctx.strokeStyle = skin.arm; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 5, cy - 7); ctx.lineTo(cx - 11, cy - 14);
  ctx.moveTo(cx + 5, cy - 7); ctx.lineTo(cx + 11, cy - 14);
  ctx.stroke();
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath(); ctx.arc(cx - 11, cy - 14, 1.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 11, cy - 14, 1.4, 0, Math.PI*2); ctx.fill();
  ctx.lineCap = 'butt';

  // Aero teardrop helmet
  ctx.fillStyle = skin.helmet;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 18);
  ctx.bezierCurveTo(cx - 5, cy - 17, cx - 5, cy - 9, cx, cy - 9);
  ctx.bezierCurveTo(cx + 5, cy - 9, cx + 5, cy - 17, cx, cy - 18);
  ctx.closePath(); ctx.fill();
  // Helmet shading
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.moveTo(cx - 5, cy - 12);
  ctx.bezierCurveTo(cx - 5, cy - 9, cx + 5, cy - 9, cx + 5, cy - 12);
  ctx.lineTo(cx, cy - 11);
  ctx.closePath(); ctx.fill();
  // Helmet vents
  ctx.fillStyle = '#1a1a1c';
  ctx.fillRect(cx - 0.8, cy - 16, 1.6, 4);
  ctx.fillRect(cx - 3, cy - 14, 1.4, 3);
  ctx.fillRect(cx + 1.6, cy - 14, 1.4, 3);
  // Sunglasses peek
  ctx.fillStyle = '#000';
  ctx.fillRect(cx - 2, cy - 11, 4, 1);
}

// Helper: trace the full diamond bike frame with current stroke
function drawHomeFrame(bb, stT, htT, rwx, rwy, fwx, fwy) {
  ctx.beginPath();
  // Seat tube: BB up to seat top
  ctx.moveTo(bb.x, bb.y);   ctx.lineTo(stT.x, stT.y);
  // Down tube: BB up-forward to head tube top
  ctx.moveTo(bb.x, bb.y);   ctx.lineTo(htT.x, htT.y);
  // Top tube: seat top to head tube top
  ctx.moveTo(stT.x, stT.y); ctx.lineTo(htT.x, htT.y);
  // Chainstay: BB to rear hub
  ctx.moveTo(bb.x, bb.y);   ctx.lineTo(rwx, rwy);
  // Seat stay: seat top to rear hub
  ctx.moveTo(stT.x, stT.y); ctx.lineTo(rwx, rwy);
  // Fork: head tube top to front hub
  ctx.moveTo(htT.x, htT.y); ctx.lineTo(fwx, fwy);
  ctx.stroke();
}

function drawCurrencyPill(x, y, label, color, pw) {
  const w = pw || 120;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(x, y, w, 28, 14); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = color; ctx.font = 'bold 14px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w/2, y + 19);
  ctx.textAlign = 'left';
}

function drawBigButton(b, t) {
  const glow = 0.5 + 0.5 * Math.sin(t * 0.08);
  // Drop shadow
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(b.x + 2, b.y + 4, b.w, b.h, 14); ctx.fill();
  // Body — darker→lighter gradient for depth
  const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  // Convert b.color to a slightly lighter top and darker bottom
  grad.addColorStop(0, lightenColor(b.color, 0.18));
  grad.addColorStop(1, darkenColor(b.color, 0.2));
  ctx.fillStyle = grad;
  roundRect(b.x, b.y, b.w, b.h, 14); ctx.fill();
  // Inner highlight (top edge)
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(b.x + 4, b.y + 3, b.w - 8, 6, 4); ctx.fill();
  // Outline + animated glow
  ctx.strokeStyle = `rgba(255,255,255,${0.35 + 0.20 * glow})`;
  ctx.lineWidth = 2; roundRect(b.x, b.y, b.w, b.h, 14); ctx.stroke();
  // Label with subtle shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.font = 'bold 24px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(b.label, b.x + b.w/2 + 1, b.y + b.h/2 + 9);
  ctx.fillStyle = '#fff';
  ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2 + 8);
  ctx.textAlign = 'left';
}

// Color helpers — accept #rrggbb and shift toward white/black
function lightenColor(hex, amt) { return shadeColor(hex, amt); }
function darkenColor(hex, amt)  { return shadeColor(hex, -amt); }
function shadeColor(hex, amt) {
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2), 16);
  const g = parseInt(c.substr(2,2), 16);
  const b = parseInt(c.substr(4,2), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt > 0 ? v + (255 - v) * amt : v + v * amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function drawDevelop(g) {
  ctx.fillStyle = '#1a2230'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8cffb7';
  ctx.font = 'bold 30px system-ui';
  ctx.fillText('DEVELOP', W/2, 60);
  ctx.fillStyle = '#bbb'; ctx.font = '13px system-ui';
  ctx.fillText('Permanent upgrades — apply to every run', W/2, 82);

  const rows = devRows();
  for (const r of rows) drawDevRow(r);

  // Back
  const bb = devBackRect();
  ctx.fillStyle = '#4a4a55';
  roundRect(bb.x, bb.y, bb.w, bb.h, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('← BACK', bb.x + bb.w/2, bb.y + 26);
  ctx.textAlign = 'left';

  drawCurrencyHud();
}

function drawDevRow(r) {
  const lvl = devLevel(r.id);
  const maxLvl = r.upgrade.levels.length;
  const atMax = lvl >= maxLvl;
  const nextCost = atMax ? null : r.upgrade.levels[lvl].cost;
  const nextLabel = atMax ? '—' : r.upgrade.levels[lvl].label;
  const canAfford = nextCost != null && SAVE.dp >= nextCost;

  // Card
  ctx.fillStyle = atMax ? 'rgba(40,60,50,0.8)' : (canAfford ? 'rgba(42,60,80,0.9)' : 'rgba(38,42,54,0.9)');
  roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.strokeStyle = atMax ? '#2a8a58' : (canAfford ? '#6fa8ff' : '#3a4458');
  ctx.lineWidth = 2; ctx.stroke();

  // Name + desc
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(r.upgrade.name, r.x + 14, r.y + 22);
  ctx.fillStyle = '#aab';
  ctx.font = '11px system-ui';
  ctx.fillText(r.upgrade.desc, r.x + 14, r.y + 38);

  // Level dots
  const dotsX = r.x + 14, dotsY = r.y + 48;
  for (let i = 0; i < maxLvl; i++) {
    ctx.fillStyle = i < lvl ? '#8cffb7' : '#394556';
    ctx.beginPath(); ctx.arc(dotsX + i * 12, dotsY, 4, 0, Math.PI*2); ctx.fill();
  }

  // Cost / max pill on right
  ctx.textAlign = 'right';
  ctx.font = 'bold 14px system-ui';
  if (atMax) {
    ctx.fillStyle = '#8cffb7';
    ctx.fillText('MAX', r.x + r.w - 14, r.y + 24);
  } else {
    ctx.fillStyle = canAfford ? '#ffd63a' : '#888';
    ctx.fillText(`${nextCost} DP`, r.x + r.w - 14, r.y + 24);
    ctx.fillStyle = '#aab';
    ctx.font = '11px system-ui';
    ctx.fillText(nextLabel, r.x + r.w - 14, r.y + 40);
  }
  ctx.textAlign = 'left';
}

function drawShop(g) {
  ctx.fillStyle = '#1a2230'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd63a';
  ctx.font = 'bold 30px system-ui';
  ctx.fillText('SHOP', W/2, 60);
  ctx.fillStyle = '#bbb'; ctx.font = '13px system-ui';
  ctx.fillText('Skins (more coming soon)', W/2, 82);

  const cards = shopCards();
  for (const c of cards) drawShopCard(c);

  // Back
  const bb = shopBackRect();
  ctx.fillStyle = '#4a4a55';
  roundRect(bb.x, bb.y, bb.w, bb.h, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('← BACK', bb.x + bb.w/2, bb.y + 26);
  ctx.textAlign = 'left';

  drawCurrencyHud();
}

function drawShopCard(c) {
  const s = c.skin;
  const owned = SAVE.owned.includes(c.id);
  const equipped = SAVE.skin === c.id;
  // Card bg
  ctx.fillStyle = s.locked ? 'rgba(30,32,40,0.9)' :
                  equipped ? 'rgba(42,82,60,0.9)' :
                  owned ? 'rgba(36,50,70,0.9)' : 'rgba(40,46,60,0.9)';
  roundRect(c.x, c.y, c.w, c.h, 10); ctx.fill();
  ctx.strokeStyle = s.locked ? '#333' :
                    equipped ? '#8cffb7' :
                    owned ? '#6fa8ff' : '#aaa';
  ctx.lineWidth = 2; ctx.stroke();

  // Preview — top-down road cyclist matching the in-game look
  const pcx = c.x + c.w/2, pcy = c.y + 52;
  if (!s.locked) {
    drawShopPreviewCyclist(pcx, pcy, s);
  } else {
    ctx.fillStyle = '#555';
    ctx.font = 'bold 32px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('🔒', pcx, pcy + 6);
  }

  // Name
  ctx.fillStyle = s.locked ? '#666' : '#fff';
  ctx.font = 'bold 13px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(s.name, pcx, c.y + 90);

  // Status / price
  ctx.font = 'bold 12px system-ui';
  if (s.locked) {
    ctx.fillStyle = '#666';
    ctx.fillText('LOCKED', pcx, c.y + 115);
  } else if (equipped) {
    ctx.fillStyle = '#8cffb7';
    ctx.fillText('EQUIPPED', pcx, c.y + 115);
  } else if (owned) {
    ctx.fillStyle = '#6fa8ff';
    ctx.fillText('TAP TO EQUIP', pcx, c.y + 115);
  } else {
    const afford = SAVE.coins >= s.price;
    ctx.fillStyle = afford ? '#ffd63a' : '#aaa';
    ctx.fillText(`${s.price}$`, pcx, c.y + 110);
    ctx.fillStyle = afford ? '#8cffb7' : '#666';
    ctx.font = '11px system-ui';
    ctx.fillText(afford ? 'TAP TO BUY' : 'need coins', pcx, c.y + 126);
  }
  ctx.textAlign = 'left';
}

function drawSlowTint(g) {
  if (g.slowTimer <= 0) return;
  // Greenish tint + subtle vignette
  ctx.fillStyle = 'rgba(79, 209, 122, 0.08)';
  ctx.fillRect(0, 0, W, H);
  // Vignette
  const grad = ctx.createRadialGradient(W/2, H/2, W*0.2, W/2, H/2, W*0.75);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(20,80,40,0.35)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // "SLOW" marker at top
  ctx.fillStyle = '#9fffc5';
  ctx.font = 'bold 12px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('◐ SLOW-MO ◑', W/2, 24);
  ctx.textAlign = 'left';
}

function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

// ============================================================
// Main loop
// ============================================================
game = newGame();

// Fixed-timestep loop: run update() at exactly 60 logical ticks/sec
// regardless of monitor refresh rate (60/120/144Hz) or tab throttling.
// Without this, the game runs 2.4x faster on a 144Hz display, etc.
const FIXED_DT_MS = 1000 / 60;   // one logical tick = ~16.67ms
const MAX_CATCHUP_MS = 250;       // cap accumulator to avoid spiral-of-death
let lastFrameTime = 0;
let accumulator = 0;

function frame(now) {
  if (!lastFrameTime) lastFrameTime = now;
  let delta = now - lastFrameTime;
  lastFrameTime = now;
  if (delta > MAX_CATCHUP_MS) delta = MAX_CATCHUP_MS; // tab was hidden, etc.
  accumulator += delta;

  // Run as many fixed ticks as fit. On a 60Hz display this is ~1/frame.
  // On 144Hz it's ~0-1/frame averaging ~0.42. On 30Hz throttled it's ~2/frame.
  let safety = 5; // hard cap per frame
  while (accumulator >= FIXED_DT_MS && safety-- > 0) {
    update(game);
    accumulator -= FIXED_DT_MS;
    // edge-triggered keys consumed once per logical tick
    for (const k in pressed) pressed[k] = false;
  }

  draw(game);
  if (isTouchDevice && touchHintShown > 0 && game.state === 'playing') {
    drawTouchHint(touchHintShown);
    touchHintShown--;
  }
  requestAnimationFrame(frame);
}

function drawTouchHint(timer) {
  const a = Math.min(1, timer / 360) * 0.55;
  // Firework zone (top)
  ctx.fillStyle = `rgba(255, 210, 74, ${a*0.18})`;
  ctx.fillRect(0, 0, W, H * 0.38);
  // Left zone
  ctx.fillStyle = `rgba(100, 180, 255, ${a*0.18})`;
  ctx.fillRect(0, H * 0.38, W/2, H * 0.62);
  // Right zone
  ctx.fillStyle = `rgba(255, 140, 140, ${a*0.18})`;
  ctx.fillRect(W/2, H * 0.38, W/2, H * 0.62);

  ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px system-ui';
  ctx.fillText('TAP TOP → FIREWORK', W/2, H * 0.38 / 2);
  ctx.font = 'bold 16px system-ui';
  ctx.fillText('◀  LEFT', W * 0.25, H * 0.7);
  ctx.fillText('RIGHT  ▶', W * 0.75, H * 0.7);
  ctx.textAlign = 'left';
}
requestAnimationFrame(frame);
})();
